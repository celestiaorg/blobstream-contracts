name: Tests
on:
  pull_request:
  push:
    branches:
      - master
      - release/**

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: rokroskar/workflow-run-cleanup-action@master
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    if: "!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/master'"

  forge-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: onbjerg/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        working-directory: ./
        run: forge fmt --check

      - name: Run forge tests with coverage
        working-directory: ./
        run: forge coverage --report lcov

      - name: Upload coverage
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./lcov.info
          use_oidc: true

  go-wrapper-check:
    runs-on: ubuntu-latest
    needs: forge-test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"

      - name: Install Foundry
        uses: onbjerg/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Go Ethereum devtools
        working-directory: ./
        run: |
          git clone --depth 1 --branch v1.15.3 https://github.com/ethereum/go-ethereum.git
          cd go-ethereum
          make devtools

      - name: Make Go wrapper
        working-directory: ./
        run: make

      - name: Check Go wrapper match
        run: |
          if [ "$(git diff --ignore-space-at-eol wrappers | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi
